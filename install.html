<style>
:root {
  --paper: #f6f6f1; --ink: #14301f; --muted: #56665b; --gold: #c9a24a; --copper: #2f5d3e; --on-light: #14301f;
  --line: #cfd3c7; --alt: #e9eae2; --field: #f4f1e8;
  --display: "Archivo", "Helvetica Neue", Arial, sans-serif;
  --body: "IBM Plex Sans", "Helvetica Neue", Arial, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --paper: #0f1612; --ink: #e6ece5; --muted: #9aa89f; --line: #2b3b32; --alt: #1d2822; --field: #17211b; --copper: #3a8a5a; color-scheme: dark; }
}
:root[data-theme="dark"] { --paper: #0f1612; --ink: #e6ece5; --muted: #9aa89f; --line: #2b3b32; --alt: #1d2822; --field: #17211b; --copper: #3a8a5a; color-scheme: dark; }
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--paper); color: var(--ink); font: 400 17px/1.6 var(--body); min-height: 100vh; display: flex; flex-direction: column; }
a { color: inherit; }
h1, h2 { font-family: var(--display); font-variation-settings: "wdth" 112; font-weight: 700; line-height: 1.08; margin: 0; }
p { margin: 0; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
:focus-visible { outline: 2px solid var(--gold); outline-offset: 3px; border-radius: 4px; }
.band { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.wrap { max-width: 1180px; margin: 0 auto; }

.bar .wrap { display: flex; align-items: center; justify-content: space-between; height: 64px; }
.brand { display: flex; align-items: center; gap: 10px; text-decoration: none; font: 700 19px/1 var(--display); font-variation-settings: "wdth" 112; }
.brand .mark { width: 30px; height: auto; display: block; }
.beta { margin-left: 8px; font: 500 13px/1 var(--mono); color: var(--muted); }
.nav { display: flex; align-items: center; gap: 28px; font-size: 15px; }
.nav a { text-decoration: none; color: var(--muted); }
.nav a:hover { color: var(--ink); }
.nav a.cta { color: var(--ink); font-weight: 600; }
@media (max-width: 640px) { .nav a:not(.cta) { display: none; } }
.theme { width: 34px; height: 34px; display: grid; place-items: center; border-radius: 8px; color: var(--muted); }
.theme:hover { color: var(--ink); background: var(--alt); }
.theme svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.theme .sun { display: none; }
:root[data-theme="dark"] .theme .sun { display: block; }
:root[data-theme="dark"] .theme .moon { display: none; }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) .theme .sun { display: block; }
  :root:not([data-theme="light"]) .theme .moon { display: none; }
}

main { flex: 1; position: relative; overflow: hidden; isolation: isolate; }
main::before { content: ""; position: absolute; inset: 0 0 auto; height: 480px; background-image: radial-gradient(var(--line) 1px, transparent 1px); background-size: 24px 24px; opacity: .5; -webkit-mask-image: linear-gradient(to bottom, #000, transparent); mask-image: linear-gradient(to bottom, #000, transparent); z-index: -1; }
.head { padding-block: 80px 48px; text-align: center; }
h1 { font-size: clamp(40px, 5.6vw, 64px); }
.sub { margin-top: 14px; color: var(--muted); font-size: 16px; }
.sub a { color: var(--ink); text-underline-offset: 4px; }

.list { max-width: 720px; margin: 0 auto; padding-bottom: 96px; display: flex; flex-direction: column; gap: 8px; }
.row { display: flex; align-items: center; justify-content: space-between; gap: 16px 24px; flex-wrap: wrap; padding: 22px 0; }
.os { display: flex; align-items: center; gap: 14px; }
.os svg { width: 26px; height: 26px; color: var(--ink); }
.os h2 { font-size: 24px; }
.dl { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: flex-end; }
.btn { display: inline-flex; align-items: center; gap: 8px; background: var(--alt); color: var(--ink); font-weight: 600; font-size: 16px; padding: 12px 18px; border-radius: 8px; text-decoration: none; }
.btn small { font: 400 13px/1 var(--mono); opacity: .75; }
.row.you .btn.main { background: var(--gold); color: var(--on-light); }
.btn[aria-disabled="true"] { cursor: default; }
.btn[aria-disabled="true"] { opacity: .55; }
.extra { width: 100%; text-align: right; font-size: 14px; color: var(--muted); margin-top: -6px; }
.extra a { color: var(--muted); text-underline-offset: 3px; }
.soon { margin-top: 32px; text-align: center; color: var(--muted); font-size: 15px; }
.notify { margin: 14px auto 0; display: flex; gap: 10px; width: 100%; max-width: 480px; }
@media (max-width: 480px) { .notify { flex-direction: column; } }
.notify input { flex: 1 1 auto; min-width: 0; font: 400 16px/1 var(--body); padding: 12px 14px; border-radius: 8px; border: 0; background: var(--field); color: var(--ink); box-shadow: inset 0 0 0 1.5px var(--copper); }
.notify .btn { flex: none; justify-content: center; background: var(--gold); color: var(--on-light); border: 0; cursor: pointer; }
@media (max-width: 560px) { .row { flex-direction: column; align-items: flex-start; gap: 14px; padding: 18px 0; } .dl { justify-content: flex-start; } .extra { text-align: left; margin-top: 0; } .head { padding-block: 56px 32px; } }

footer { padding-block: 32px 48px; color: var(--muted); font-size: 15px; }
footer .wrap { display: flex; flex-wrap: wrap; gap: 16px 32px; justify-content: space-between; }
footer nav { display: flex; gap: 24px; }
footer a { text-decoration: none; }
footer a:hover { color: var(--ink); }
</style>

  if (saved === "dark" || saved === "light") root.dataset.theme = saved;
  const isDark = () => root.dataset.theme ? root.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  const label = () => tb.setAttribute("aria-label", isDark() ? "Switch to light mode" : "Switch to dark mode");
  label();
  tb.addEventListener("click", () => { const next = isDark() ? "light" : "dark"; root.dataset.theme = next; try { localStorage.setItem("theme", next); } catch (e) {} label(); });
})();
</script>
</body>
